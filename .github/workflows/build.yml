name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [lockdown, goblock]
        arch: [amd64]        # ajoute arm64 ici si tu veux aussi la version ARM
    env:
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # Génère/complète go.sum avant le build.
      # Sans cette étape, Go 1.16+ refuse de compiler si go.sum est absent
      # ou incomplet (mode -mod=readonly par défaut).
      - name: Tidy dependencies
        run: go mod tidy

      - name: Build ${{ matrix.app }}-${{ matrix.arch }}.exe
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/${{ matrix.app }}-${{ matrix.arch }}.exe ./${{ matrix.app }}

      - name: Checksum SHA-256
        run: sha256sum dist/${{ matrix.app }}-${{ matrix.arch }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows-${{ matrix.arch }}
          path: dist/${{ matrix.app }}-${{ matrix.arch }}.exe
          if-no-files-found: error
